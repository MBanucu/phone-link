name: Release

# A tag is the only thing that publishes. The APK is built from the tagged tree
# and signed with the release key — never the debug key the checked-in
# `android/debug.keystore` carries — so a tag that does not build leaves no APK
# behind, and no branch ever produces one. The keys are repository secrets:
# `ANDROID_KEYSTORE` (the keystore, base64 so it can be a text secret),
# `ANDROID_KEYSTORE_PASS`, `ANDROID_KEY_ALIAS` and, if the key's password
# differs from the store's, `ANDROID_KEY_PASS`. See android/README.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # The Android SDK comes from the flake, and a cold cache pays for it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # The keystore is a binary, and a secret is text: it travels base64-encoded
      # and is written to $RUNNER_TEMP, which the runner discards with the job.
      # Every check here fails the job rather than falling back to the debug key.
      - name: Unpack the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          missing=""
          [ -n "${KEYSTORE:-}" ] || missing="$missing ANDROID_KEYSTORE"
          [ -n "${KEYSTORE_PASS:-}" ] || missing="$missing ANDROID_KEYSTORE_PASS"
          [ -n "${KEY_ALIAS:-}" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing — a release APK is signed with the release key, never the debug one" >&2
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE" | base64 -d > "$keystore"
          # Only the paths go into the job's environment: the passwords are read
          # from the secrets again by the step that builds, so neither is ever
          # written to a file that outlives it.
          {
            echo "PHONE_APP_KEYSTORE=$keystore"
            echo "PHONE_APP_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      # build.sh signs with whatever PHONE_APP_KEYSTORE names, so this is the
      # same script a local release build runs — and the certificate is read back
      # afterwards, because a build that quietly used the debug key would
      # otherwise look exactly like one that did not.
      - name: Build the APK with the release key
        env:
          PHONE_APP_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          PHONE_APP_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS || secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -eu
          cat > "$RUNNER_TEMP/build-release.sh" <<'SCRIPT'
          set -eu
          ./android/build.sh
          apksigner=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs android/build/phone-link-proxy.apk)
          printf "%s\n" "$certs"
          if printf "%s" "$certs" | grep -q "CN=phone-link proxy debug"; then
            echo "::error::the APK carries the debug key; refusing to publish it" >&2
            exit 1
          fi
          SCRIPT
          chmod +x "$RUNNER_TEMP/build-release.sh"
          nix develop .#android --command "$RUNNER_TEMP/build-release.sh"

      # The asset is named after the app's own version, not the tag's: the app
      # and the flake version independently, and a phone installing
      # `phone-link-proxy-0.1.0.apk` should be able to tell what it got.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' \
            android/AndroidManifest.xml | head -1)
          if [ -z "$version" ]; then
            echo "::error::no android:versionName in android/AndroidManifest.xml" >&2
            exit 1
          fi
          asset="$RUNNER_TEMP/phone-link-proxy-$version.apk"
          cp android/build/phone-link-proxy.apk "$asset"
          (cd "$RUNNER_TEMP" &&
            sha256sum "phone-link-proxy-$version.apk" > "phone-link-proxy-$version.apk.sha256")
          # A release for the tag may already exist with notes written by hand:
          # upload into it instead of failing, and replace what a re-run left.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
          echo "attached $(basename "$asset") to $TAG" >> "$GITHUB_STEP_SUMMARY"
